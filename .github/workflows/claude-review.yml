name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  review:
    if: |
      github.event_name == 'pull_request' ||
      contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review this PR for a Laravel backend. Focus on:
            - Missing DB transactions and race conditions (orders, stock, payments)
            - N+1 queries and missing eager loading
            - Validation (use FormRequests) and authorization (policies/gates)
            - Mass assignment, SQL injection, leaked secrets
            - Missing tests for new logic
            Comment inline on specific lines and keep it concise.
